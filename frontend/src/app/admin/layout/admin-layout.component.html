<!-- frontend/src/app/admin/layout/admin-layout.component.html -->
<div class="admin-portal">

  <!-- Backdrop for Mobile Drawer -->
  @if (mobileMenuOpen()) {
    <div class="mobile-backdrop" (click)="closeMobileMenu()" id="admin-mobile-backdrop"></div>
  }

  <!-- Fixed Left Sidebar -->
  <aside class="sidebar" [class.sidebar--mobile-open]="mobileMenuOpen()">
    <nav class="sidebar__nav">

      <!-- 1. Dashboard -->
      <a class="sidebar__link" routerLink="/admin/dashboard" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="admin-nav-dashboard">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </span>
        <span class="sidebar__label">Dashboard</span>
      </a>

      <!-- 2. Students -->
      <a class="sidebar__link" routerLink="/admin/students" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="admin-nav-students">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 3-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </span>
        <span class="sidebar__label">Students</span>
      </a>

      <!-- 3. Hostels -->
      <a class="sidebar__link" routerLink="/admin/hostels" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="admin-nav-hostels">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12" y2="22"></line>
          </svg>
        </span>
        <span class="sidebar__label">Hostels</span>
      </a>

      <!-- 4. Rooms -->
      <a class="sidebar__link" routerLink="/admin/rooms" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="admin-nav-rooms">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"></path>
            <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"></path>
            <circle cx="14" cy="12" r="1"></circle>
          </svg>
        </span>
        <span class="sidebar__label">Rooms</span>
      </a>

      <!-- 5. Applications -->
      <a class="sidebar__link" routerLink="/admin/applications" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="admin-nav-applications">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </span>
        <span class="sidebar__label">Applications</span>
      </a>

      <!-- 6. Eligibility -->
      <a class="sidebar__link" routerLink="/admin/eligibility" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="admin-nav-eligibility">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </span>
        <span class="sidebar__label">Eligibility Management</span>
      </a>

      <!-- 7. Merit & Allocation -->
      <a class="sidebar__link" routerLink="/admin/merit" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="admin-nav-merit">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </span>
        <span class="sidebar__label">Merit & Allocation</span>
      </a>

      <!-- 7b. District Seat Distribution -->
      <a class="sidebar__link" routerLink="/admin/district-distribution" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="admin-nav-district-distribution">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
            <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
          </svg>
        </span>
        <span class="sidebar__label">District Quota Distribution</span>
      </a>

      <!-- 8. Residents -->
      <a class="sidebar__link" routerLink="/admin/residents" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="admin-nav-residents">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </span>
        <span class="sidebar__label">Residents</span>
      </a>

      <!-- 9. Fees Allocation -->
      <a class="sidebar__link" routerLink="/admin/settings" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="admin-nav-settings">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
          </svg>
        </span>
        <span class="sidebar__label">Fees Allocation</span>
      </a>

      <!-- 10. Controls -->
      <a class="sidebar__link" routerLink="/admin/controls" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="admin-nav-controls">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </span>
        <span class="sidebar__label">Controls</span>
      </a>

    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="portal-main">

    <!-- Top Header -->
    <header class="portal-header">
      <div class="portal-header__left">
        <button class="hamburger-btn" (click)="toggleMobileMenu()" id="admin-hamburger-menu-btn"
          aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="header-logo">
          <div class="header-logo__badge">SDP</div>
          <span class="header-logo__text">Sindh Dormitory Portal Admin</span>
        </div>
      </div>

      <div class="portal-header__right">
        <div class="header-user-profile">
          <div class="header-avatar">AD</div>
          <div class="header-user-info">
            <span class="header-username">Admin User</span>
            <span class="header-role">Administrator</span>
          </div>
        </div>
        <button class="header-logout-btn" (click)="logout()" id="admin-logout-btn" title="Logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page Content Router Outlet -->
    <div class="portal-content">
      <router-outlet></router-outlet>
    </div>

  </main>
</div>
