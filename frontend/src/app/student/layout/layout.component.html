<!-- student/layout/layout.component.html -->
<div class="student-portal">

  <!-- ── Backdrop for Mobile Drawer ────────────────────────── -->
  @if (mobileMenuOpen()) {
  <div class="mobile-backdrop" (click)="closeMobileMenu()" id="mobile-backdrop"></div>
  }

  <!-- ── Fixed Left Sidebar ────────────────────────────────── -->
  <aside class="sidebar" [class.sidebar--mobile-open]="mobileMenuOpen()">
    <nav class="sidebar__nav">
      <!-- 1. Dashboard -->
      <a class="sidebar__link" routerLink="/student/dashboard" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="nav-dashboard">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </span>
        <span class="sidebar__label">Dashboard</span>
      </a>

      <!-- 2. My Profile -->
      <a class="sidebar__link" routerLink="/student/profile" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="nav-profile">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </span>
        <span class="sidebar__label">My Profile</span>
      </a>

      <!-- 3. Hostel Application -->
      <a class="sidebar__link" routerLink="/student/apply" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="nav-apply">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </span>
        <span class="sidebar__label">Hostel Application</span>
      </a>

      <!-- 4. My Hostel -->
      <a class="sidebar__link" routerLink="/student/hostel" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="nav-hostel">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12" y2="22"></line>
          </svg>
        </span>
        <span class="sidebar__label">My Hostel</span>
      </a>

      <!-- 5. Room Change -->
      <a class="sidebar__link" routerLink="/student/room-change" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="nav-room-change">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </span>
        <span class="sidebar__label">Room Change</span>
      </a>

      <!-- Merit Result -->
      <a class="sidebar__link" routerLink="/student/merit-result" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="nav-merit-result">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </span>
        <span class="sidebar__label">Merit Result</span>
      </a>

      <!-- 6. Challans -->
      <a class="sidebar__link" routerLink="/student/challans" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="nav-challans">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
            <line x1="1" y1="10" x2="23" y2="10"></line>
          </svg>
        </span>
        <span class="sidebar__label">Challans</span>
      </a>

      <!-- 7. Notifications -->
      <a class="sidebar__link" routerLink="/student/notifications" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="nav-notifications">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </span>
        <span class="sidebar__label">Notifications</span>
      </a>

      <!-- 8. Complaints -->
      <a class="sidebar__link" routerLink="/student/complaints" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="nav-complaints">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </span>
        <span class="sidebar__label">Complaints</span>
      </a>

      <!-- 9. Feedback -->
      <a class="sidebar__link" routerLink="/student/feedback" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="nav-feedback">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </span>
        <span class="sidebar__label">Feedback</span>
      </a>

      <!-- 10. Settings -->
      <a class="sidebar__link" routerLink="/student/settings" routerLinkActive="sidebar__link--active"
        (click)="closeMobileMenu()" id="nav-settings">
        <span class="sidebar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </span>
        <span class="sidebar__label">Settings</span>
      </a>
    </nav>

  </aside>

  <!-- ── Main Content Area ─────────────────────────────────── -->
  <main class="portal-main">

    <!-- Top Header -->
    <header class="portal-header">
      <div class="portal-header__left">
        <button class="hamburger-btn" (click)="toggleMobileMenu()" id="hamburger-menu-btn"
          aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="header-logo">
          <div class="header-logo__badge">SDP</div>
          <span class="header-logo__text">Sindh Dormitory Portal</span>
        </div>
      </div>

      <div class="portal-header__right">
        <div class="header-user-profile">
          <div class="header-avatar">{{ userInitials() }}</div>
          <div class="header-user-info">
            <span class="header-username">{{ userName() }}</span>
            <span class="header-role">Student</span>
          </div>
        </div>
        <a routerLink="/student/notifications" class="header-icon-btn" title="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </a>
        <button class="header-logout-btn" (click)="logout()" id="logout-btn" title="Logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page Content Router Outlet -->
    <div class="portal-content">
      <router-outlet></router-outlet>
    </div>

    <!-- Mobile Bottom Navigation Bar (< 640px) -->
    <nav class="mobile-bottom-nav">
      <a routerLink="/student/dashboard" routerLinkActive="active" class="bottom-nav__item">
        <span class="bottom-nav__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </span>
        <span class="bottom-nav__label">Home</span>
      </a>
      <a routerLink="/student/apply" routerLinkActive="active" class="bottom-nav__item">
        <span class="bottom-nav__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          </svg>
        </span>
        <span class="bottom-nav__label">Apply</span>
      </a>
      <a routerLink="/student/hostel" routerLinkActive="active" class="bottom-nav__item">
        <span class="bottom-nav__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
          </svg>
        </span>
        <span class="bottom-nav__label">Hostel</span>
      </a>
      <a routerLink="/student/challans" routerLinkActive="active" class="bottom-nav__item">
        <span class="bottom-nav__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
          </svg>
        </span>
        <span class="bottom-nav__label">Fees</span>
      </a>
      <a routerLink="/student/profile" routerLinkActive="active" class="bottom-nav__item">
        <span class="bottom-nav__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </span>
        <span class="bottom-nav__label">Profile</span>
      </a>
    </nav>
  </main>
</div>
