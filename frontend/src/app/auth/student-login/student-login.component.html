<div class="login-container">
  <h2 style="text-align: center; margin-bottom: 1.5rem; color: #333;">Student Login</h2>
  
  <div *ngIf="serverError" class="server-error">
    {{ serverError }}
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="cnic">CNIC (13 digits)</label>
      <input id="cnic" type="text" formControlName="cnic" placeholder="e.g. 4130412345678" />
      <div *ngIf="loginForm.get('cnic')?.touched && loginForm.get('cnic')?.invalid" class="error">
        <span *ngIf="loginForm.get('cnic')?.errors?.['required']">CNIC is required.</span>
        <span *ngIf="loginForm.get('cnic')?.errors?.['pattern']">Please enter a valid 13-digit CNIC without dashes.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-input-wrapper">
        <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Enter your password" />
        <button type="button" class="toggle-password-btn" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#015C3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>
      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error">
        <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</span>
      </div>
    </div>

    <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isLoading">
      {{ isLoading ? 'Logging in...' : 'Login' }}
    </button>
  </form>

  <div class="auth-subtext">
    <p>Admin Access? <a routerLink="/auth/admin-login">Click here</a></p>
    <p>Don't have an account? <a routerLink="/auth/register">Register here</a></p>
  </div>
</div>
