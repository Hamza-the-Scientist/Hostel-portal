<div class="login-container">
  <h2 style="text-align: center; margin-bottom: 1.5rem; color: #333;">Admin Login</h2>
  
  <div *ngIf="serverError" class="server-error">
    {{ serverError }}
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="admin@domain.edu" />
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="error">
        <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</span>
        <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" placeholder="Enter your password" />
      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error">
        <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</span>
      </div>
    </div>

    <button type="submit" [disabled]="loginForm.invalid || isLoading">
      {{ isLoading ? 'Authenticating...' : 'Secure Login' }}
    </button>
  </form>

  <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
    Student Access? <a routerLink="/auth/student-login" style="color: #28a745;">Click here</a>
  </p>
</div>
